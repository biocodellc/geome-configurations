<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GEOME Network Visualizer - Extraction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    :root {
      --bg: #f6f2ea;
      --panel: #ffffff;
      --ink: #1f2933;
      --muted: #6b7280;
      --accent: #1b998b;
      --accent-2: #e98b4f;
      --accent-3: #5b8def;
      --line: #e5e7eb;
      --shadow: 0 12px 40px rgba(16, 24, 40, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--ink);
      background: radial-gradient(1200px 600px at 20% -10%, #fdf7ee 0%, #f6f2ea 55%, #efe6d6 100%);
    }
    header {
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(135deg, #ffffff 0%, #faf6ef 100%);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    header h1 {
      font-family: "Space Grotesk", sans-serif;
      font-size: 20px;
      letter-spacing: 0.4px;
      margin: 0;
    }
    header .meta {
      color: var(--muted);
      font-size: 13px;
    }
    .header-tools {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .manual-loader {
      display: none;
      align-items: center;
      gap: 6px;
    }
    .manual-loader input[type="file"] {
      font-size: 12px;
    }
    .config-switch {
      border: 1px solid var(--line);
      background: #ffffff;
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 12px;
      color: var(--ink);
    }
    .header-link {
      border: 1px solid var(--line);
      background: #ffffff;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      color: var(--ink);
      text-decoration: none;
    }
    .header-link:hover {
      border-color: var(--accent);
    }
    .header-button {
      cursor: pointer;
      font-family: inherit;
    }
    .header-button:disabled {
      color: var(--muted);
      cursor: not-allowed;
      opacity: 0.65;
    }
    .header-button:disabled:hover {
      border-color: var(--line);
    }
    .detail-tools {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }
    main {
      display: grid;
      grid-template-columns: minmax(280px, 25vw) minmax(0, 1fr);
      gap: 16px;
      padding: 16px 18px 26px;
    }
    .panel {
      background: var(--panel);
      border-radius: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
      overflow: hidden;
      min-height: 200px;
    }
    .panel h2 {
      font-family: "Space Grotesk", sans-serif;
      font-size: 16px;
      margin: 0 0 10px;
    }
    .search {
      width: 100%;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      font-size: 14px;
      background: #f9fafb;
    }
    .graph-panel {
      position: relative;
      padding: 0 0 12px;
      overflow: hidden;
    }
    .graph-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px 0;
    }
    .graph-panel-copy {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }
    #graph {
      width: 100%;
      height: clamp(320px, calc(100vh - 240px), 520px);
      display: block;
    }
    .legend-bubble {
      position: absolute;
      top: 72px;
      left: 16px;
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.96);
      color: var(--ink);
      box-shadow: var(--shadow);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: "Space Grotesk", sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      z-index: 3;
    }
    .legend-bubble:hover {
      border-color: var(--accent);
      background: #ffffff;
    }
    .graph-legend {
      position: absolute;
      top: 114px;
      left: 16px;
      background: rgba(255,255,255,0.9);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 11px;
      box-shadow: var(--shadow);
      max-width: 180px;
      z-index: 3;
      display: none;
    }
    .graph-legend.open {
      display: block;
    }
    .legend-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    .legend-title {
      font-family: "Space Grotesk", sans-serif;
      font-size: 12px;
      font-weight: 600;
      margin: 0;
    }
    .legend-close {
      border: none;
      background: #f3f4f6;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
    }
    .legend-link {
      width: 14px;
      height: 0;
      border-top: 2px dashed #64748b;
      display: inline-block;
    }
    .detail-panel {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 120px);
    }
    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: #f9fafb;
      gap: 12px;
    }
    .detail-kicker {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--muted);
    }
    .detail-title {
      font-family: "Space Grotesk", sans-serif;
      font-size: 18px;
      font-weight: 600;
    }
    .detail-sub {
      font-size: 12px;
      color: var(--muted);
      text-align: right;
      max-width: 180px;
    }
    .detail-content {
      padding: 14px 16px 18px;
      overflow-y: auto;
      max-height: calc(100vh - 220px);
    }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .meta-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 10px;
      background: #fafafa;
      font-size: 12px;
    }
    .meta-card strong {
      display: block;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }
    th, td {
      text-align: left;
      padding: 6px 8px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    th {
      background: #f3f4f6;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .attribute-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .attribute-search {
      min-width: 220px;
      max-width: 360px;
      flex: 1 1 240px;
    }
    .attribute-row {
      cursor: pointer;
    }
    .attribute-row:hover {
      background: #f8fafc;
    }
    .attribute-table {
      table-layout: fixed;
    }
    .attribute-table th,
    .attribute-table td {
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .attribute-table .attr-col-column { width: 13%; }
    .attribute-table .attr-col-type { width: 9%; }
    .attribute-table .attr-col-definition { width: 16%; }
    .attribute-table .attr-col-uri { width: 14%; }
    .attribute-table .attr-col-definedby { width: 18%; }
    .attribute-table .attr-col-lists { width: 16%; }
    .attribute-table .attr-col-internal { width: 7%; }
    .attribute-table .attr-col-unknown { width: 7%; }
    .attribute-table td.attr-col-definedby a,
    .attribute-table td.attr-col-uri a {
      overflow-wrap: anywhere;
      word-break: break-word;
      white-space: normal;
    }
    a {
      color: var(--accent-3);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      background: #eef6f5;
      border: 1px solid #d4ebe7;
      margin: 4px 4px 0 0;
      cursor: pointer;
    }
    .list-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 10px;
      background: #fff;
    }
    .list-values {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .value-chip {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 12px;
    }
    .list-modal-table-wrap {
      margin-top: 8px;
      max-height: 54vh;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .list-modal-table td {
      font-size: 12px;
      max-width: 260px;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 11px;
      background: #fef3c7;
      color: #92400e;
      margin-left: 6px;
    }
    .rules-index-item {
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--line);
      margin-bottom: 8px;
    }
    .muted { color: var(--muted); }

    .rule-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 10px;
      background: #fff;
    }
    .rule-card strong { font-size: 13px; }
    .rule-meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .rule-actions { margin-top: 8px; }
    .attribute-link {
      stroke: #64748b;
      stroke-dasharray: 3 4;
      stroke-width: 1.7;
      opacity: 0.85;
      fill: none;
      pointer-events: none;
    }
    .attribute-link-label {
      font-size: 10px;
      fill: #334155;
      pointer-events: none;
      paint-order: stroke;
      stroke: #ffffff;
      stroke-width: 3;
      stroke-linejoin: round;
      stroke-linecap: round;
      font-weight: 600;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 20;
    }
    .modal.open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      background: #fff;
      border-radius: 16px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      max-width: 560px;
      width: min(90vw, 560px);
      max-height: 80vh;
      overflow: auto;
      padding: 16px 18px 20px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .modal-title {
      font-family: "Space Grotesk", sans-serif;
      font-size: 16px;
      margin: 0;
    }
    .modal-close {
      border: none;
      background: #f1f5f9;
      border-radius: 999px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 12px;
    }

    @media (max-width: 1100px) {
      main {
        grid-template-columns: 1fr;
      }
      .header-tools {
        width: 100%;
        justify-content: flex-start;
      }
      .detail-content { max-height: none; }
      #graph { min-height: 420px; }
      .graph-panel {
        min-height: auto;
      }
      .detail-panel {
        height: auto;
      }
      #graph {
        height: clamp(280px, 48vh, 420px);
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>GEOME Network Visualizer</h1>
      <div class="meta" id="configHint">Entity relationships, attributes, rules, and vocabularies</div>
    </div>
    <div class="header-tools">
      <label class="meta" for="configSelect">Configuration</label>
      <select class="config-switch" id="configSelect" aria-label="Select configuration">
        <option value="network">GEOME network (default)</option>
      </select>
      <button class="header-link header-button" id="downloadConfigSpreadsheet" type="button" disabled>
        Download entire configuration as a spreadsheet
      </button>
      <a class="header-link" href="./stats.html">GEOME Statistics Viewer</a>
      <div class="meta" id="summary"></div>
      <label class="manual-loader meta" id="manualLoader">
        Load JSON
        <input id="manualJsonInput" type="file" accept=".json,application/json" />
      </label>
    </div>
  </header>

  <main>
    <section class="panel graph-panel">
      <div class="graph-panel-header">
        <div>
          <h2>Diagram</h2>
          <div class="graph-panel-copy">Click an entity node to show its attributes, rules, and referenced lists on the right.</div>
        </div>
      </div>
      <svg id="graph"></svg>
      <button class="legend-bubble" id="legendToggle" type="button" aria-label="Open legend" aria-expanded="false">?</button>
      <div class="graph-legend" id="legend"></div>
    </section>

    <section class="panel detail-panel">
      <div class="detail-header">
        <div>
          <div class="detail-kicker">Entity</div>
          <div class="detail-title" id="entityTitle">—</div>
        </div>
        <div class="detail-tools">
          <div class="detail-sub" id="entitySub"></div>
        </div>
      </div>
      <div class="detail-content" id="details"></div>
    </section>
  </main>

  
  <div class="modal" id="modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">Details</h3>
        <button class="modal-close" id="modalClose">Close</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>
  <script>
    const CONFIG_ENDPOINTS = {
      network: 'https://api.geome-db.org/network/1/config',
      teams: 'https://api.geome-db.org/projects/configs?networkApproved=true',
      teamConfig: (id) => `https://api.geome-db.org/projects/configs/${encodeURIComponent(id)}?includePublic=true`
    };
    const NETWORK_FILE_CANDIDATES = [
      './network_extraction.json',
      'network_extraction.json',
      '/docs/network_extraction.json',
      '../docs/network_extraction.json'
    ];
    const PROPOSAL_FILE_CANDIDATES = [
      './proposed_folded_sample_derived_data.json',
      'proposed_folded_sample_derived_data.json',
      '/docs/proposed_folded_sample_derived_data.json',
      '../docs/proposed_folded_sample_derived_data.json'
    ];
    const SOURCE_OPTIONS = new Map();
    let activeConfig = null;
    let activeConfigName = 'GEOME network configuration';

    function stripInvalidXmlChars(value) {
      return String(value).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
    }

    function xmlEscape(value) {
      return stripInvalidXmlChars(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&apos;');
    }

    function spreadsheetValue(value) {
      if (value === null || value === undefined) return '';
      if (Array.isArray(value)) {
        if (value.every(item => item === null || ['string', 'number', 'boolean', 'undefined'].includes(typeof item))) {
          return value.filter(item => item !== null && item !== undefined).join('; ');
        }
        return JSON.stringify(value);
      }
      if (typeof value === 'object') return JSON.stringify(value);
      return String(value);
    }

    function collectKeys(rows, preferredKeys = []) {
      const seen = new Set();
      const keys = [];
      preferredKeys.forEach((key) => {
        if (!seen.has(key)) {
          seen.add(key);
          keys.push(key);
        }
      });
      rows.forEach((row) => {
        Object.keys(row || {}).sort().forEach((key) => {
          if (seen.has(key)) return;
          seen.add(key);
          keys.push(key);
        });
      });
      return keys;
    }

    function sheetRowsFromObjects(objects, preferredKeys = []) {
      const keys = collectKeys(objects, preferredKeys);
      return [
        keys,
        ...objects.map((object) => keys.map(key => spreadsheetValue(object?.[key])))
      ];
    }

    function normalizeListField(field) {
      if (field && typeof field === 'object' && !Array.isArray(field)) return field;
      return { value: field };
    }

    function buildWorkbookSheets(config) {
      const entities = Array.isArray(config?.entities) ? config.entities : [];
      const lists = Array.isArray(config?.lists) ? config.lists : [];
      const exportedAt = new Date().toISOString();

      const configRows = [
        ['key', 'value'],
        ['source', activeConfigName],
        ['exportedAt', exportedAt],
        ['entityCount', entities.length],
        ['listCount', lists.length]
      ];
      Object.keys(config || {}).sort().forEach((key) => {
        if (key === 'entities' || key === 'lists') return;
        configRows.push([key, spreadsheetValue(config[key])]);
      });

      const entityRows = entities.map((entity) => {
        const { attributes, rules, ...entityMetadata } = entity || {};
        return {
          ...entityMetadata,
          attributeCount: Array.isArray(attributes) ? attributes.length : 0,
          ruleCount: Array.isArray(rules) ? rules.length : 0
        };
      });

      const attributeRows = [];
      entities.forEach((entity) => {
        (entity?.attributes || []).forEach((attribute, index) => {
          attributeRows.push({
            entity: entity?.conceptAlias || '',
            attributeIndex: index + 1,
            ...attribute
          });
        });
      });

      const ruleRows = [];
      entities.forEach((entity) => {
        (entity?.rules || []).forEach((rule, index) => {
          ruleRows.push({
            entity: entity?.conceptAlias || '',
            ruleIndex: index + 1,
            ...rule
          });
        });
      });

      const listRows = lists.map((list) => {
        const { fields, ...listMetadata } = list || {};
        return {
          ...listMetadata,
          valueCount: Array.isArray(fields) ? fields.length : 0
        };
      });

      const listValueRows = [];
      lists.forEach((list) => {
        (list?.fields || []).forEach((field, index) => {
          listValueRows.push({
            list: list?.alias || '',
            valueIndex: index + 1,
            ...normalizeListField(field)
          });
        });
      });

      return [
        { name: 'Configuration', rows: configRows },
        {
          name: 'Entities',
          rows: sheetRowsFromObjects(entityRows, [
            'conceptAlias',
            'type',
            'worksheet',
            'parentEntity',
            'uniqueKey',
            'conceptURI',
            'recordType',
            'hashed',
            'uniqueAcrossProject',
            'attributeCount',
            'ruleCount'
          ])
        },
        {
          name: 'Attributes',
          rows: sheetRowsFromObjects(attributeRows, [
            'entity',
            'attributeIndex',
            'column',
            'dataType',
            'uri',
            'definedBy',
            'definition',
            'group',
            'internal',
            'allowUnknown',
            'allowTBD',
            'delimitedBy'
          ])
        },
        {
          name: 'Rules',
          rows: sheetRowsFromObjects(ruleRows, [
            'entity',
            'ruleIndex',
            'name',
            'level',
            'column',
            'columns',
            'otherColumn',
            'listName',
            'range',
            'pattern',
            'uniqueAcrossProject'
          ])
        },
        {
          name: 'Lists',
          rows: sheetRowsFromObjects(listRows, [
            'alias',
            'caseInsensitive',
            'networkList',
            'valueCount'
          ])
        },
        {
          name: 'List Values',
          rows: sheetRowsFromObjects(listValueRows, [
            'list',
            'valueIndex',
            'value',
            'definition',
            'definedBy'
          ])
        }
      ];
    }

    function workbookCellXml(value, isHeader = false) {
      const style = isHeader ? ' ss:StyleID="Header"' : '';
      return `<Cell${style}><Data ss:Type="String">${xmlEscape(spreadsheetValue(value))}</Data></Cell>`;
    }

    function workbookSheetXml(sheet) {
      const rows = sheet.rows?.length ? sheet.rows : [['']];
      const name = String(sheet.name || 'Sheet').slice(0, 31);
      return `
        <Worksheet ss:Name="${xmlEscape(name)}">
          <Table>
            ${rows.map((row, rowIndex) => `
              <Row>
                ${(row || []).map(value => workbookCellXml(value, rowIndex === 0)).join('')}
              </Row>
            `).join('')}
          </Table>
          <WorksheetOptions xmlns="urn:schemas-microsoft-com:office:excel">
            <FreezePanes/>
            <FrozenNoSplit/>
            <SplitHorizontal>1</SplitHorizontal>
            <TopRowBottomPane>1</TopRowBottomPane>
            <ActivePane>2</ActivePane>
          </WorksheetOptions>
        </Worksheet>
      `;
    }

    function buildExcelWorkbookXml(config) {
      const sheets = buildWorkbookSheets(config);
      return `<?xml version="1.0" encoding="UTF-8"?>
        <?mso-application progid="Excel.Sheet"?>
        <Workbook
          xmlns="urn:schemas-microsoft-com:office:spreadsheet"
          xmlns:o="urn:schemas-microsoft-com:office:office"
          xmlns:x="urn:schemas-microsoft-com:office:excel"
          xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"
          xmlns:html="http://www.w3.org/TR/REC-html40">
          <Styles>
            <Style ss:ID="Header">
              <Font ss:Bold="1"/>
              <Interior ss:Color="#F3F4F6" ss:Pattern="Solid"/>
            </Style>
          </Styles>
          ${sheets.map(workbookSheetXml).join('')}
        </Workbook>`;
    }

    function slugifyFilename(value) {
      const slug = String(value || 'geome-configuration')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '')
        .slice(0, 80);
      return slug || 'geome-configuration';
    }

    function setDownloadAvailability(enabled) {
      const button = document.getElementById('downloadConfigSpreadsheet');
      if (!button) return;
      button.disabled = !enabled;
    }

    function setupConfigDownload() {
      const button = document.getElementById('downloadConfigSpreadsheet');
      if (!button) return;
      button.addEventListener('click', () => {
        if (!activeConfig) {
          const summary = document.getElementById('summary');
          if (summary) summary.textContent = 'No configuration loaded to download';
          return;
        }
        const workbookXml = buildExcelWorkbookXml(activeConfig);
        const blob = new Blob([workbookXml], {
          type: 'application/vnd.ms-excel;charset=utf-8'
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `${slugifyFilename(activeConfigName)}-configuration.xls`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      });
    }

    function normalizeConfigPayload(raw) {
      if (raw && raw.config && Array.isArray(raw.config.entities)) return raw.config;
      if (raw && Array.isArray(raw.entities)) return raw;
      throw new Error('Response does not contain entities/lists configuration');
    }

    function getSelectedSourceKey() {
      const params = new URLSearchParams(window.location.search);
      const source = params.get('source');
      if (source && SOURCE_OPTIONS.has(source)) return source;
      const legacyConfig = params.get('config');
      if (legacyConfig === 'current') return 'network';
      return 'network';
    }

    async function fetchJson(url) {
      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status} for ${url}`);
      return response.json();
    }

    function addSourceOption(select, key, label) {
      const option = document.createElement('option');
      option.value = key;
      option.textContent = label;
      select.appendChild(option);
    }

    async function populateConfigOptions() {
      const configSelect = document.getElementById('configSelect');
      if (!configSelect) return;

      SOURCE_OPTIONS.clear();
      configSelect.innerHTML = '';

      SOURCE_OPTIONS.set('network', {
        label: 'GEOME network',
        displayName: 'GEOME network configuration',
        candidates: [
          ...NETWORK_FILE_CANDIDATES,
          CONFIG_ENDPOINTS.network
        ]
      });
      addSourceOption(configSelect, 'network', 'GEOME network (default)');
      SOURCE_OPTIONS.set('proposal-folded-sample-derived-data', {
        label: 'Proposal: folded Sample + derivedData',
        displayName: 'Proposal model: folded Sample + derivedData',
        candidates: PROPOSAL_FILE_CANDIDATES
      });
      addSourceOption(configSelect, 'proposal-folded-sample-derived-data', 'Proposal: folded Sample + derivedData');
      SOURCE_OPTIONS.set('local', {
        label: 'Local JSON file',
        displayName: 'Local JSON file',
        candidates: []
      });
      addSourceOption(configSelect, 'local', 'Local JSON file...');

      try {
        const teamPayload = await fetchJson(CONFIG_ENDPOINTS.teams);
        const teamRows = Array.isArray(teamPayload)
          ? teamPayload
          : (Array.isArray(teamPayload?.configurations) ? teamPayload.configurations : []);

        const teams = teamRows
          .filter((team) => team && team.id && team.name && team.networkApproved)
          .sort((a, b) => String(a.name).localeCompare(String(b.name)));

        teams.forEach((team) => {
          const key = `team:${team.id}`;
          SOURCE_OPTIONS.set(key, {
            label: team.name,
            displayName: `${team.name} team configuration`,
            candidates: [CONFIG_ENDPOINTS.teamConfig(team.id)]
          });
          addSourceOption(configSelect, key, team.name);
        });
      } catch (err) {
        console.error('Unable to fetch team configurations', err);
      }
    }

    function setManualLoaderVisibility(visible) {
      const manualLoader = document.getElementById('manualLoader');
      if (!manualLoader) return;
      manualLoader.style.display = visible ? 'inline-flex' : 'none';
    }

    function updateConfigUI(sourceKey) {
      const configSelect = document.getElementById('configSelect');
      const configHint = document.getElementById('configHint');
      const selected = SOURCE_OPTIONS.get(sourceKey) || SOURCE_OPTIONS.get('network');
      if (configSelect && selected) configSelect.value = sourceKey;
      if (configHint) {
        const label = selected ? selected.displayName : 'GEOME network configuration';
        configHint.textContent = `${label} • Entity relationships, attributes, rules, and vocabularies`;
      }
      setManualLoaderVisibility(sourceKey === 'local');
    }

    async function setupConfigSelector() {
      const configSelect = document.getElementById('configSelect');
      if (!configSelect) return;

      await populateConfigOptions();
      const sourceKey = getSelectedSourceKey();
      const selected = SOURCE_OPTIONS.has(sourceKey) ? sourceKey : 'network';
      updateConfigUI(selected);
      configSelect.value = selected;

      configSelect.addEventListener('change', () => {
        const params = new URLSearchParams(window.location.search);
        params.set('source', configSelect.value);
        params.delete('config');
        const next = `${window.location.pathname}?${params.toString()}${window.location.hash}`;
        window.location.assign(next);
      });
    }

    async function loadConfig() {
      const sourceKey = getSelectedSourceKey();
      const selected = SOURCE_OPTIONS.get(sourceKey) || SOURCE_OPTIONS.get('network');
      updateConfigUI(sourceKey);
      activeConfig = null;
      setDownloadAvailability(false);
      const summary = document.getElementById('summary');

      if (sourceKey === 'local') {
        if (summary) summary.textContent = 'Select a local JSON file to load';
        setManualLoaderVisibility(true);
        return;
      }

      try {
        let lastError = null;
        const candidates = Array.isArray(selected.candidates) ? selected.candidates : [];
        for (const url of candidates) {
          try {
            const raw = await fetchJson(url);
            init(normalizeConfigPayload(raw));
            return;
          } catch (err) {
            lastError = err;
          }
        }
        if (lastError) throw lastError;
        return;
      } catch (err) {
        console.error(err);
        if (summary) {
          summary.textContent = `Failed to load ${selected.displayName}`;
        }
        setManualLoaderVisibility(true);
      }
    }

    function setupManualLoader() {
      const input = document.getElementById('manualJsonInput');
      if (!input) return;
      input.addEventListener('change', (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        activeConfig = null;
        setDownloadAvailability(false);
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const raw = JSON.parse(String(reader.result || ''));
            init(normalizeConfigPayload(raw));
            activeConfigName = file.name.replace(/\.json$/i, '') || 'Local JSON file';
            const summary = document.getElementById('summary');
            if (summary) summary.textContent = `Loaded local file: ${file.name}`;
            const params = new URLSearchParams(window.location.search);
            if (params.get('source') !== 'local') {
              params.set('source', 'local');
              params.delete('config');
              const next = `${window.location.pathname}?${params.toString()}${window.location.hash}`;
              window.history.replaceState({}, '', next);
            }
          } catch (err) {
            console.error(err);
            const summary = document.getElementById('summary');
            if (summary) summary.textContent = 'Manual file load failed: invalid JSON';
          }
        };
        reader.readAsText(file);
      });
    }

    setupConfigDownload();
    setupManualLoader();
    (async () => {
      await setupConfigSelector();
      await loadConfig();
    })();

    function init(raw) {
    activeConfig = raw;
    activeConfigName = SOURCE_OPTIONS.get(getSelectedSourceKey())?.displayName || 'GEOME configuration';
    setDownloadAvailability(true);
    const entities = raw.entities || [];
    const lists = raw.lists || [];
    const listByAlias = new Map(lists.map(l => [l.alias, l]));
    const listAliasByLower = new Map();
    lists.forEach((list) => {
      const normalizedAlias = String(list?.alias || '').trim().toLowerCase();
      if (!normalizedAlias || listAliasByLower.has(normalizedAlias)) return;
      listAliasByLower.set(normalizedAlias, list.alias);
    });

    const entityByAlias = new Map(entities.map(e => [e.conceptAlias, e]));
    const childrenByParent = new Map();
    entities.forEach(e => {
      if (!e.parentEntity) return;
      if (!childrenByParent.has(e.parentEntity)) childrenByParent.set(e.parentEntity, []);
      childrenByParent.get(e.parentEntity).push(e.conceptAlias);
    });

    function normalizeId(value) {
      return String(value || '').trim().toLowerCase();
    }

    function findListAliasForColumn(column) {
      if (!column) return null;
      if (listByAlias.has(column)) return column;
      return listAliasByLower.get(normalizeId(column)) || null;
    }

    function inferAttributeRelationships() {
      const uniqueKeyTargets = new Map();
      entities.forEach((entity) => {
        const normalizedKey = normalizeId(entity.uniqueKey);
        if (!normalizedKey) return;
        if (!uniqueKeyTargets.has(normalizedKey)) {
          uniqueKeyTargets.set(normalizedKey, entity.conceptAlias);
        }
      });

      const explicitTargets = new Map([
        ['fromtissueid', 'Tissue'],
        ['fromsampleid', 'Sample'],
        ['fromtissue', 'Tissue'],
        ['fromsample', 'Sample'],
        ['parenteventid', 'Event'],
        ['relatedeventid', 'Event']
      ]);

      const relationships = [];
      entities.forEach((entity) => {
        const sourceAlias = entity.conceptAlias;
        const sourceUniqueKey = normalizeId(entity.uniqueKey);
        const parentAlias = entity.parentEntity;
        const parentUniqueKey = normalizeId(entityByAlias.get(parentAlias)?.uniqueKey);
        (entity.attributes || []).forEach((attribute) => {
          const column = attribute?.column;
          const normalizedColumn = normalizeId(column);
          if (!normalizedColumn) return;
          if (normalizedColumn === sourceUniqueKey) return;

          let targetAlias = explicitTargets.get(normalizedColumn) || uniqueKeyTargets.get(normalizedColumn);

          if (!targetAlias && normalizedColumn.endsWith('id')) {
            const stem = normalizedColumn.slice(0, -2);
            const candidates = [
              stem,
              stem.replace(/^from/, ''),
              stem.replace(/^parent/, ''),
              stem.replace(/^related/, '')
            ];
            targetAlias = Array.from(entityByAlias.keys()).find((alias) => {
              const normalizedAlias = normalizeId(alias);
              return candidates.some(candidate => candidate && candidate === normalizedAlias);
            });
          }

          if (!targetAlias || !entityByAlias.has(targetAlias)) return;
          if (parentAlias && targetAlias === parentAlias && parentUniqueKey && normalizedColumn === parentUniqueKey) {
            return;
          }

          relationships.push({
            from: sourceAlias,
            to: targetAlias,
            label: column
          });
        });
      });

      const seen = new Set();
      return relationships.filter((relationship) => {
        const key = `${relationship.from}|${relationship.to}|${relationship.label}`;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    const attributeRelationships = inferAttributeRelationships();

    const summary = document.getElementById('summary');
    summary.textContent = `${entities.length} entities • ${lists.length} vocabularies`;

    const entityTitle = document.getElementById('entityTitle');
    const entitySub = document.getElementById('entitySub');

    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const modalClose = document.getElementById('modalClose');

    function openModal(title, bodyHtml) {
      modalTitle.textContent = title;
      modalBody.innerHTML = bodyHtml;
      modal.classList.add('open');
    }

    function closeModal() {
      modal.classList.remove('open');
    }

    modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    let selectedAlias = entityByAlias.has('Event') ? 'Event' : (entities[0]?.conceptAlias || null);
    let nodeSelection = null;

    const graphPanel = document.querySelector('.graph-panel');

    function makeLink(value) {
      if (!value) return '';
      const text = String(value);
      if (text.startsWith('http')) {
        return `<a href="${text}" target="_blank" rel="noopener">${text}</a>`;
      }
      return text;
    }

    function safe(val) {
      if (val === null || val === undefined) return '';
      if (Array.isArray(val)) return val.join(', ');
      if (typeof val === 'object') return JSON.stringify(val);
      return String(val);
    }

    function ruleColumns(rule) {
      if (rule.column) return [rule.column];
      if (Array.isArray(rule.columns)) return rule.columns;
      return [];
    }

    function describeRule(rule) {
      if (rule.name === 'RequireValueIfOtherColumn' && rule.otherColumn) {
        return `Requires a value when ${rule.otherColumn} is present.`;
      }
      if (rule.name === 'ControlledVocabulary' && rule.listName) {
        return `Value must be in list \"${rule.listName}\".`;
      }
      if (rule.name === 'NumericRange' && rule.range) {
        return `Value must be within ${rule.range}.`;
      }
      if (rule.name === 'RegExp' && rule.pattern) {
        return `Value must match pattern ${rule.pattern}.`;
      }
      if (rule.name === 'UniqueValue') {
        return `Value must be unique (${rule.uniqueAcrossProject ? 'across project' : 'within project'}).`;
      }
      if (rule.name === 'CompositeUniqueValue' && rule.columns) {
        return `Combination must be unique across ${rule.columns.join(', ')}.`;
      }
      if (rule.name === 'RequiredValue' && rule.columns) {
        return `Required fields: ${rule.columns.join(', ')}.`;
      }
      return 'Rule applies as defined in configuration.';
    }

    let currentListUsage = new Map();

    function renderDetails(alias) {
      const entity = entityByAlias.get(alias);
      if (!entity) return;

      const parent = entity.parentEntity || 'Root';
      const children = childrenByParent.get(alias) || [];
      const parentChain = [];
      let current = entity.parentEntity;
      while (current) {
        parentChain.push(current);
        current = entityByAlias.get(current)?.parentEntity;
      }

      const attributes = entity.attributes || [];
      const rules = entity.rules || [];

      const listUsage = new Map();
      const listByColumn = new Map();

      rules.forEach(r => {
        if (!r.listName) return;
        const cols = ruleColumns(r);
        if (!listUsage.has(r.listName)) listUsage.set(r.listName, { columns: new Set(), rules: new Set() });
        listUsage.get(r.listName).rules.add(r.name);
        cols.forEach(c => {
          listUsage.get(r.listName).columns.add(c);
          if (!listByColumn.has(c)) listByColumn.set(c, new Set());
          listByColumn.get(c).add(r.listName);
        });
      });

      attributes.forEach((attribute) => {
        const column = attribute?.column;
        const matchedListAlias = findListAliasForColumn(column);
        if (!column || !matchedListAlias) return;
        if (!listUsage.has(matchedListAlias)) {
          listUsage.set(matchedListAlias, { columns: new Set(), rules: new Set() });
        }
        listUsage.get(matchedListAlias).columns.add(column);
        if (!listByColumn.has(column)) listByColumn.set(column, new Set());
        listByColumn.get(column).add(matchedListAlias);
      });

      currentListUsage = listUsage;

      entityTitle.textContent = entity.conceptAlias || '—';
      entitySub.textContent = `${entity.type || 'Entity'} • ${parent}`;

      const details = document.getElementById('details');
      details.innerHTML = `
        <div class="meta-grid">
          <div class="meta-card"><strong>Type</strong>${safe(entity.type)}</div>
          <div class="meta-card"><strong>Worksheet</strong>${safe(entity.worksheet)}</div>
          <div class="meta-card"><strong>Parent</strong>${safe(parent)}</div>
          <div class="meta-card"><strong>Unique Key</strong>${safe(entity.uniqueKey)}</div>
          <div class="meta-card"><strong>Record Type</strong>${safe(entity.recordType)}</div>
          <div class="meta-card"><strong>Concept URI</strong>${safe(entity.conceptURI)}</div>
        </div>
        <div class="muted">Parent chain: ${parentChain.length ? parentChain.join(' → ') : 'None'}</div>
        <div>${children.map(c => `<span class="pill" data-entity="${c}">Child: ${c}</span>`).join(' ')}</div>

        <h2 style="margin-top:16px">Attributes (${attributes.length})</h2>
        <div class="attribute-tools">
          <input
            class="search attribute-search"
            id="attributeSearch"
            type="text"
            placeholder="Search attributes..."
          />
          <span class="muted" id="attributeMatchCount">Showing ${attributes.length} of ${attributes.length}</span>
        </div>
        <div style="max-height:280px; overflow:auto; border:1px solid var(--line); border-radius:12px;">
          <table class="attribute-table">
            <thead>
              <tr>
                <th class="attr-col-column">column</th>
                <th class="attr-col-type">dataType</th>
                <th class="attr-col-definition">definition</th>
                <th class="attr-col-uri">uri</th>
                <th class="attr-col-definedby">definedBy</th>
                <th class="attr-col-lists">lists</th>
                <th class="attr-col-internal">internal</th>
                <th class="attr-col-unknown">allowUnknown</th>
              </tr>
            </thead>
            <tbody id="attributeRows"></tbody>
          </table>
        </div>

        <h2 style="margin-top:16px">Rules (${rules.length})</h2>
        <div class="attribute-tools">
          <input
            class="search attribute-search"
            id="ruleSearch"
            type="text"
            placeholder="Search attributes within rules..."
          />
          <span class="muted" id="ruleMatchCount">Showing ${rules.length} of ${rules.length}</span>
        </div>
        <div id="ruleCards"></div>

        <h2 style="margin-top:16px">Lists Referenced (${listUsage.size})</h2>
        <div>
          ${Array.from(listUsage.keys()).map(l => `<span class="pill" data-list="${l}">${l}</span>`).join(' ') || '<span class="muted">None</span>'}
        </div>
      `;

      details.querySelectorAll('.pill[data-entity]').forEach(p => {
        p.addEventListener('click', () => selectEntity(p.dataset.entity));
      });

      const attributeRows = details.querySelector('#attributeRows');
      const attributeSearch = details.querySelector('#attributeSearch');
      const attributeMatchCount = details.querySelector('#attributeMatchCount');
      const ruleCards = details.querySelector('#ruleCards');
      const ruleSearch = details.querySelector('#ruleSearch');
      const ruleMatchCount = details.querySelector('#ruleMatchCount');

      function renderAttributeRows(filterText = '') {
        const needle = String(filterText || '').toLowerCase();
        const filtered = attributes
          .map((attribute, index) => ({ attribute, index }))
          .filter(({ attribute }) => String(attribute.column || '').toLowerCase().includes(needle));

        attributeMatchCount.textContent = `Showing ${filtered.length} of ${attributes.length}`;
        attributeRows.innerHTML = filtered.length ? filtered.map(({ attribute, index }) => {
          const definitionText = String(attribute.definition || '');
          const definitionPreview = definitionText.length > 20
            ? `${definitionText.slice(0, 20)}...`
            : definitionText;
          const listPills = listByColumn.has(attribute.column)
            ? Array.from(listByColumn.get(attribute.column)).map(listAlias => `<span class="pill" data-list="${listAlias}">${listAlias}</span>`).join('')
            : '';
          return `
            <tr class="attribute-row" data-attribute-index="${index}" title="Click for full attribute details">
              <td class="attr-col-column">${safe(attribute.column)}</td>
              <td class="attr-col-type">${safe(attribute.dataType)}</td>
              <td class="attr-col-definition" title="${safe(definitionText)}">${safe(definitionPreview) || '<span class="muted">—</span>'}</td>
              <td class="attr-col-uri">${makeLink(attribute.uri) || safe(attribute.uri)}</td>
              <td class="attr-col-definedby">${makeLink(attribute.definedBy) || safe(attribute.definedBy)}</td>
              <td class="attr-col-lists">${listPills || '<span class="muted">—</span>'}</td>
              <td class="attr-col-internal">${safe(attribute.internal)}</td>
              <td class="attr-col-unknown">${safe(attribute.allowUnknown)}</td>
            </tr>
          `;
        }).join('') : `
          <tr>
            <td colspan="8" class="muted">No matching attributes</td>
          </tr>
        `;
      }

      attributeSearch.addEventListener('input', (event) => {
        renderAttributeRows(event.target.value);
      });

      attributeRows.addEventListener('click', (event) => {
        const listPill = event.target.closest('.pill[data-list]');
        if (listPill) {
          event.stopPropagation();
          openListModal(listPill.dataset.list);
          return;
        }
        if (event.target.closest('a')) return;
        const row = event.target.closest('.attribute-row');
        if (!row) return;
        const attributeIndex = Number(row.dataset.attributeIndex);
        const attribute = attributes[attributeIndex];
        if (attribute) openAttributeModal(attribute);
      });

      renderAttributeRows();
      function renderRuleCards(filterText = '') {
        const needle = String(filterText || '').toLowerCase();
        const filteredRules = rules
          .map((rule, index) => ({ rule, index }))
          .filter(({ rule }) => {
            if (!needle) return true;
            const cols = ruleColumns(rule);
            const haystack = [
              rule.name || '',
              ...(cols || []),
              rule.otherColumn || '',
              rule.listName || '',
              rule.pattern || '',
              rule.range || ''
            ].join(' ').toLowerCase();
            return haystack.includes(needle);
          });

        ruleMatchCount.textContent = `Showing ${filteredRules.length} of ${rules.length}`;
        ruleCards.innerHTML = filteredRules.length ? filteredRules.map(({ rule, index }) => {
          const cols = ruleColumns(rule);
          const colText = cols.length ? cols.join(', ') : 'All / unspecified';
          return `
            <div class="rule-card">
              <strong>${safe(rule.name)}</strong>
              <span class="badge">${safe(rule.level || '—')}</span>
              <div class="rule-meta">Applies to: ${safe(colText)}</div>
              <div class="rule-meta">${describeRule(rule)}</div>
              <div class="rule-actions">
                <span class="pill" data-rule-index="${index}">View rule details</span>
              </div>
            </div>
          `;
        }).join('') : '<div class="muted">No matching rules</div>';
      }

      ruleSearch.addEventListener('input', (event) => {
        renderRuleCards(event.target.value);
      });

      ruleCards.addEventListener('click', (event) => {
        const pill = event.target.closest('.pill[data-rule-index]');
        if (!pill) return;
        const idx = Number(pill.dataset.ruleIndex);
        const rule = rules[idx];
        if (rule) openRuleModal(rule);
      });

      renderRuleCards();

      details.querySelectorAll('.pill[data-list]').forEach(p => {
        if (p.closest('#attributeRows')) return;
        p.addEventListener('click', () => openListModal(p.dataset.list));
      });
    }

    function openAttributeModal(attribute) {
      if (!attribute) return;
      const preferredKeys = [
        'column',
        'dataType',
        'uri',
        'definedBy',
        'definition',
        'group',
        'internal',
        'allowUnknown',
        'allowTBD',
        'delimitedBy'
      ];
      const keys = Object.keys(attribute);
      const orderedKeys = [
        ...preferredKeys.filter(key => keys.includes(key)),
        ...keys.filter(key => !preferredKeys.includes(key)).sort()
      ];
      const rows = orderedKeys.map(key => {
        const value = attribute[key];
        const renderedValue = (key === 'uri' || key === 'definedBy')
          ? (makeLink(value) || safe(value))
          : safe(value);
        return `
          <tr>
            <td style="width: 34%;"><strong>${safe(key)}</strong></td>
            <td>${renderedValue || '<span class="muted">—</span>'}</td>
          </tr>
        `;
      }).join('');

      const body = `
        <div class="muted">All available metadata for this attribute.</div>
        <div style="margin-top:8px; max-height:60vh; overflow:auto; border:1px solid var(--line); border-radius:12px;">
          <table>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
      openModal(`Attribute: ${safe(attribute.column || '(unnamed)')}`, body);
    }

    function openRuleModal(rule) {
      const cols = ruleColumns(rule);
      const fieldList = cols.length ? cols : ['(entity-level)'];
      const extra = [];
      if (rule.listName) extra.push(`<div><strong>List:</strong> ${rule.listName}</div>`);
      if (rule.range) extra.push(`<div><strong>Range:</strong> ${rule.range}</div>`);
      if (rule.pattern) extra.push(`<div><strong>Pattern:</strong> ${rule.pattern}</div>`);
      if (rule.otherColumn) extra.push(`<div><strong>Other Column:</strong> ${rule.otherColumn}</div>`);
      if (rule.uniqueAcrossProject !== undefined) extra.push(`<div><strong>Unique Across Project:</strong> ${rule.uniqueAcrossProject}</div>`);

      const body = `
        <div class="muted">Rule type: ${safe(rule.name)} • Level: ${safe(rule.level || '—')}</div>
        <p>${describeRule(rule)}</p>
        <h4>Applies to</h4>
        <ul>
          ${fieldList.map(c => `<li><strong>${c}</strong> — ${describeRule(rule)}</li>`).join('')}
        </ul>
        ${extra.length ? `<h4>Rule Parameters</h4>${extra.join('')}` : ''}
      `;
      openModal(`Rule: ${safe(rule.name)}`, body);
    }

    function openListModal(alias) {
      const list = listByAlias.get(alias);
      if (!list) return;
      const usage = currentListUsage.get(alias);
      const usedColumns = usage ? Array.from(usage.columns) : [];
      const usedRules = usage ? Array.from(usage.rules) : [];

      const rawFields = Array.isArray(list.fields) ? list.fields : [];
      const fields = rawFields.map((field) => {
        if (field && typeof field === 'object' && !Array.isArray(field)) return field;
        return { value: field };
      });
      const keySet = new Set();
      fields.forEach((field) => Object.keys(field).forEach((key) => keySet.add(key)));
      const preferredKeys = ['value', 'definition', 'definedBy'];
      const keys = [
        ...preferredKeys.filter((key) => keySet.has(key)),
        ...Array.from(keySet).filter((key) => !preferredKeys.includes(key)).sort()
      ];
      const max = 200;
      const shown = fields.slice(0, max);
      const valueCount = fields.length;
      const tableHead = keys.map((key) => `<th>${safe(key)}</th>`).join('');
      const tableRows = shown.map((field) => {
        const cells = keys.map((key) => {
          const val = field[key];
          const rendered = key === 'definedBy'
            ? (makeLink(val) || safe(val))
            : safe(val);
          return `<td>${rendered || '<span class="muted">—</span>'}</td>`;
        }).join('');
        return `<tr>${cells}</tr>`;
      }).join('');
      const fallback = '<tr><td class="muted">No values found</td></tr>';

      const body = `
        <div class="muted">caseInsensitive: ${safe(list.caseInsensitive)} • values: ${valueCount}</div>
        <p>Used by rules: ${usedRules.length ? usedRules.join(', ') : '—'}</p>
        <p>Columns using this list: ${usedColumns.length ? usedColumns.join(', ') : '—'}</p>
        <div class="list-modal-table-wrap">
          <table class="list-modal-table">
            <thead>
              <tr>${tableHead || '<th>value</th>'}</tr>
            </thead>
            <tbody>
              ${tableRows || fallback}
            </tbody>
          </table>
        </div>
        ${valueCount > max ? `<div class="muted" style="margin-top:8px;">Showing first ${max} list elements</div>` : ''}
      `;
      openModal(`List: ${alias}`, body);
    }

    function selectEntity(alias) {
      selectedAlias = alias;
      renderDetails(alias);
      highlightNode(alias);
    }

    renderDetails(selectedAlias);
    // Graph (hierarchy: Event at top)
    const colorMap = {
      DefaultEntity: '#1b998b',
      Tissue: '#2a9d8f',
      Photo: '#e76f51',
      Fasta: '#e9c46a',
      Fastq: '#f4a261',
      Extraction: '#5b8def'
    };

    function buildTree(alias, visited = new Set()) {
      if (visited.has(alias)) {
        return { name: alias, entity: entityByAlias.get(alias), children: [] };
      }
      visited.add(alias);
      const children = childrenByParent.get(alias) || [];
      return {
        name: alias,
        entity: entityByAlias.get(alias),
        children: children.map(child => buildTree(child, visited))
      };
    }

    function highlightNode(alias) {
      if (!nodeSelection) return;
      nodeSelection.selectAll('circle')
        .attr('stroke', d => d.data.name === alias ? '#111827' : '#0f172a')
        .attr('stroke-width', d => d.data.name === alias ? 3 : 1.5)
        .attr('opacity', d => d.data.name === alias ? 1 : 0.75);
    }

    function renderGraph() {
      const svg = d3.select('#graph');
      const svgElement = svg.node();
      const width = Math.max(graphPanel.clientWidth, 280);
      const height = Math.max(svgElement?.clientHeight || graphPanel.clientHeight || 360, 280);
      const nodeRadius = entities.length > 5 ? 20 : 22;
      const labelFontSize = entities.length > 5 ? 9 : 10;
      svg.attr('viewBox', `0 0 ${width} ${height}`);
      svg.selectAll('*').remove();
      svg.on('.zoom', null);

      const g = svg.append('g');
      svg.call(d3.zoom().scaleExtent([0.6, 2.5]).on('zoom', (event) => g.attr('transform', event.transform)));

      const rootAlias = entityByAlias.has('Event')
        ? 'Event'
        : entities.find(e => !e.parentEntity || !entityByAlias.has(e.parentEntity))?.conceptAlias;

      const treeData = rootAlias ? buildTree(rootAlias) : { name: 'root', entity: null, children: [] };
      const root = d3.hierarchy(treeData, d => d.children);

      const margin = { top: 20, right: 18, bottom: 20, left: 18 };
      const treeLayout = d3.tree().size([width - margin.left - margin.right, height - margin.top - margin.bottom]);
      treeLayout(root);

      const linkPath = d3.linkVertical()
        .x(d => d.x + margin.left)
        .y(d => d.y + margin.top);

      g.append('g')
        .attr('stroke', '#94a3b8')
        .attr('stroke-opacity', 0.6)
        .attr('fill', 'none')
        .selectAll('path')
        .data(root.links())
        .join('path')
        .attr('stroke-width', 2)
        .attr('d', linkPath);

      const nodePositions = new Map(
        root.descendants().map(d => [d.data.name, { x: d.x + margin.left, y: d.y + margin.top }])
      );

      const renderedRelationships = attributeRelationships.filter(
        relationship => nodePositions.has(relationship.from) && nodePositions.has(relationship.to)
      );

      function relationshipPath(relationship) {
        const source = nodePositions.get(relationship.from);
        const target = nodePositions.get(relationship.to);
        if (!source || !target) return '';

        if (relationship.from === relationship.to) {
          const r = nodeRadius;
          return `M ${source.x + r * 0.55} ${source.y - r * 0.75} C ${source.x + r * 1.65} ${source.y - r * 1.9}, ${source.x - r * 1.65} ${source.y - r * 1.9}, ${source.x - r * 0.55} ${source.y - r * 0.75}`;
        }

        const dx = target.x - source.x;
        const dy = target.y - source.y;
        const distance = Math.hypot(dx, dy) || 1;
        const bend = Math.min(42, Math.max(18, distance * 0.18));
        const nx = -dy / distance;
        const ny = dx / distance;
        const controlX = (source.x + target.x) / 2 + nx * bend;
        const controlY = (source.y + target.y) / 2 + ny * bend;
        return `M ${source.x} ${source.y} Q ${controlX} ${controlY} ${target.x} ${target.y}`;
      }

      function relationshipLabelPosition(relationship) {
        const source = nodePositions.get(relationship.from);
        const target = nodePositions.get(relationship.to);
        if (!source || !target) return { x: 0, y: 0 };

        if (relationship.from === relationship.to) {
          const r = nodeRadius;
          return { x: source.x, y: source.y - r * 2.15 };
        }

        const dx = target.x - source.x;
        const dy = target.y - source.y;
        const distance = Math.hypot(dx, dy) || 1;
        const bend = Math.min(42, Math.max(18, distance * 0.18));
        const nx = -dy / distance;
        const ny = dx / distance;
        return {
          x: (source.x + target.x) / 2 + nx * bend,
          y: (source.y + target.y) / 2 + ny * bend - 4
        };
      }

      const relationshipLayer = g.append('g').attr('class', 'attribute-relationship-layer');
      relationshipLayer.selectAll('path')
        .data(renderedRelationships)
        .join('path')
        .attr('class', 'attribute-link')
        .attr('d', relationshipPath);

      relationshipLayer.selectAll('text')
        .data(renderedRelationships)
        .join('text')
        .attr('class', 'attribute-link-label')
        .attr('x', relationship => relationshipLabelPosition(relationship).x)
        .attr('y', relationship => relationshipLabelPosition(relationship).y)
        .attr('text-anchor', 'middle')
        .text(relationship => relationship.label || '');

      nodeSelection = g.append('g')
        .selectAll('g')
        .data(root.descendants())
        .join('g')
        .attr('class', 'node')
        .attr('transform', d => `translate(${d.x + margin.left}, ${d.y + margin.top})`)
        .style('cursor', 'pointer');

      nodeSelection.append('circle')
        .attr('r', nodeRadius)
        .attr('fill', d => colorMap[d.data.entity?.type] || '#94a3b8')
        .attr('stroke', '#0f172a')
        .attr('stroke-width', 1.5)
        .attr('opacity', 0.92);

      nodeSelection.append('text')
        .text(d => d.data.name)
        .attr('text-anchor', 'middle')
        .attr('dy', 4)
        .attr('fill', '#0f172a')
        .attr('font-size', labelFontSize)
        .attr('font-weight', 600);

      nodeSelection.on('click', (event, d) => {
        if (d.data.name) selectEntity(d.data.name);
      });

      highlightNode(selectedAlias);
    }

    // Legend
    const legend = document.getElementById('legend');
    const legendToggle = document.getElementById('legendToggle');
    function closeLegend() {
      legend.classList.remove('open');
      legendToggle.setAttribute('aria-expanded', 'false');
    }
    function openLegend() {
      legend.classList.add('open');
      legendToggle.setAttribute('aria-expanded', 'true');
    }

    legend.innerHTML = `
      <div class="legend-header">
        <div class="legend-title">Legend</div>
        <button class="legend-close" id="legendClose" type="button">Close</button>
      </div>
      ${[
        ...Object.entries(colorMap).map(([type, color]) => `
          <div class="legend-row"><span class="legend-dot" style="background:${color}"></span>${type}</div>
        `),
        `<div class="legend-row"><span class="legend-link"></span>Attribute relationship</div>`
      ].join('')}
    `;

    const legendClose = document.getElementById('legendClose');
    legendToggle.addEventListener('click', () => {
      if (legend.classList.contains('open')) {
        closeLegend();
      } else {
        openLegend();
      }
    });
    legendClose.addEventListener('click', closeLegend);
    document.addEventListener('click', (event) => {
      if (!legend.classList.contains('open')) return;
      if (legend.contains(event.target) || legendToggle.contains(event.target)) return;
      closeLegend();
    });

    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        renderGraph();
      }, 120);
    });

    renderGraph();
    }
  </script>
</body>
</html>
